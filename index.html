<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>巡邏打卡</title>
<style>
:root{--bg:#0e1626;--card:#18233a;--card2:#1f2d4a;--line:#2c3c5e;--tx:#e9eef8;--mut:#8fa0c0;--acc:#f5b82e;--ok:#35c98a;--bad:#ff6464;--blue:#4c8dff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px}
#app{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:16px;margin:22px 0 8px;color:var(--acc);letter-spacing:1px}
.hero{background:linear-gradient(135deg,#1c2b4d,#131d33);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.hero .site{font-size:24px;font-weight:800}
.hero .sub{color:var(--mut);margin-top:6px}
.hero .sub b{color:var(--acc);font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.slot{display:flex;align-items:center;gap:12px;cursor:pointer}
.slot .t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:92px}
.slot .m{flex:1;min-width:0}
.slot .m div:first-child{font-weight:600}
.slot .m div:last-child{color:var(--mut);font-size:14px;margin-top:2px}
.badge{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--mut);white-space:nowrap;font-weight:600}
.badge.ok{background:#12402e;color:var(--ok)}.badge.bad{background:#4a1d22;color:var(--bad)}.badge.go{background:#4a3a10;color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1a1300;font-weight:700}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;background:var(--card2);color:var(--tx);cursor:pointer;font-family:inherit}
.btn.pri{background:var(--acc);color:#1a1300}.btn.red{background:#4a1d22;color:var(--bad)}.btn.sm{padding:6px 10px;font-size:13px}
.btn.big{width:100%;padding:15px;font-size:17px;margin-top:10px}
.btn.cam{background:var(--blue);color:#fff;white-space:nowrap}
.pt{border-left:5px solid var(--line)}
.pt.done{border-left-color:var(--ok)}.pt.isbad{border-left-color:var(--bad)}
.pt-head{display:flex;align-items:center;gap:10px}
.pt-head .no{width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.pt-head .nm{flex:1;font-size:18px;font-weight:700;min-width:0}
.pt-time{color:var(--mut);font-size:13px;margin:6px 0 0 40px}
.thumbs{display:flex;gap:10px;margin-top:10px}
.th{width:calc(50% - 5px)}
.th img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;background:#000}
.th-b{display:flex;gap:6px;margin-top:6px}.th-b .btn{flex:1}
.st{display:flex;gap:8px;margin-top:10px;align-items:center}
.st .chip{padding:7px 14px}
.st .chip.on.b{background:var(--bad);border-color:var(--bad);color:#fff}
.st .chip.on.g{background:var(--ok);border-color:var(--ok);color:#03200f}
input[type=text],input[type=time],input[type=date],input[type=number],input[type=password],select{width:100%;background:#0d1524;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row>.g{flex:1;min-width:0}
.row .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hint{color:var(--mut);font-size:13px;margin:4px 0 10px;line-height:1.6}
.warn{background:#4a1d22;color:#ffd0d0;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.6}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b1220;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:213px;background:none;border:0;color:var(--mut);padding:12px 0 10px;font-size:13px;font-family:inherit;cursor:pointer}
nav button span{display:block;font-size:22px;margin-bottom:2px}
nav button.on{color:var(--acc);font-weight:700}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 18px;border-radius:99px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
#toast.on{opacity:1}
#viewer{position:fixed;inset:0;background:#000e;display:none;place-items:center;z-index:60}
#viewer img{max-width:100%;max-height:100%}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum th,table.sum td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.sum th{color:var(--mut);font-weight:500}
.rep-img{width:100%;border-radius:8px;border:1px solid var(--line);display:block;margin-bottom:8px}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
#sync{position:sticky;top:0;z-index:20;background:#0b1220;border-bottom:1px solid var(--line);color:var(--mut);font-size:13px;padding:7px 14px;text-align:center;cursor:pointer}
#sync.ok{color:var(--ok)}#sync.wait{color:var(--acc)}
.day-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}.day-h b{font-size:19px;flex:1}
.rs{border-top:1px solid var(--line);padding:9px 0 4px}.rs-h{font-size:15px;line-height:1.6}.rs-h b{font-size:18px;margin-right:6px}
.rp{font-size:13.5px;color:#c9d3e8;padding:3px 0 3px 10px;line-height:1.6}.rp a{color:var(--blue);margin-left:6px}.rp .tm{color:var(--mut);margin:0 6px}
.mini{width:34px;height:26px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-left:6px}.mut-t{color:var(--mut)}
</style>
</head>
<body>
<div id="sync" data-act="sync"></div>
<div id="app"></div>
<nav>
  <button data-act="tab" data-v="home"><span>🔦</span>巡邏打卡</button>
  <button data-act="tab" data-v="report"><span>📋</span>巡邏報告</button>
  <button data-act="tab" data-v="settings"><span>⚙️</span>設定</button>
</nav>
<div id="toast"></div>
<div id="viewer"><img alt=""></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200);}

/* ---------- 儲存 ---------- */
const Store={db:null,mem:{},
 async init(){
  try{
   this.db=await new Promise((res,rej)=>{
    const r=indexedDB.open('patrolDB',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('rec');};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej('blocked');
    setTimeout(()=>rej('timeout'),4000);
   });
  }catch(e){this.db=null;}
 },
 tx(st,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
 async get(st,k){return this.db?this.tx(st,'readonly',s=>s.get(k)):this.mem[st+'/'+k];},
 async put(st,k,v){if(!this.db){this.mem[st+'/'+k]=v;return;}return this.tx(st,'readwrite',s=>s.put(v,k));},
 async del(st,k){if(!this.db){delete this.mem[st+'/'+k];return;}return this.tx(st,'readwrite',s=>s.delete(k));},
 async keys(st){if(!this.db)return Object.keys(this.mem).filter(k=>k.startsWith(st+'/')).map(k=>k.slice(st.length+1));return this.tx(st,'readonly',s=>s.getAllKeys());}
};

/* ---------- 設定 ---------- */
function defaults(){
 const pts=['大門口','中庭','地下停車場B1','環保室','機房','頂樓'].map(n=>({id:uid(),name:n}));
 const rt={id:uid(),name:'巡邏路線',pids:pts.map(p=>p.id)};
 return{code:uid(),site:'',guards:[],points:pts,routes:[rt],
  slots:['22:00','00:00','02:00','04:00'].map(t=>({id:uid(),time:t,routeId:rt.id})),
  tol:30,cutoff:8,roc:true,pin:'',lastGuard:'',gas:'',token:'',
  phrases:['一切正常','燈具不亮','門未關妥','有積水／漏水','發現可疑人士','垃圾未清','設備異音']};
}
let cfg=defaults(),sites=[],siteId='';
function norm(c){const d=Object.assign(defaults(),c);if(!c.code)d.code='main';(d.routes||[]).forEach(r=>{if(r.name==='夜間巡邏路線')r.name='巡邏路線';});return d;}
function setCfg(c){cfg=c;const s=sites.find(x=>x.id===siteId);if(s)s.cfg=c;}
const recGet=k=>Store.get('rec',siteId+'|'+k),recPut=(k,v)=>Store.put('rec',siteId+'|'+k,v),recDel=k=>Store.del('rec',siteId+'|'+k);
async function recKeys(){const p=siteId+'|';return(await Store.keys('rec')).filter(k=>String(k).startsWith(p)).map(k=>String(k).slice(p.length));}
const siteName=c=>c.site||'未命名案場';
async function switchSite(id){
 if(id===siteId)return;
 if(syncing){toast('上傳中，請稍候再切換');return;}
 if(pend.length&&!confirm('目前案場還有 '+pend.length+' 個班次尚未上傳，切換後要切回這個案場才會補傳。確定切換？'))return;
 siteId=id;cfg=sites.find(s=>s.id===id).cfg;cur=null;live.clear();repDate=null;repPages=[];repCloud=null;repErr='';syncErr='';
 try{await Store.put('kv','curSite',id);pend=(await Store.get('kv','pend|'+id))||[];}catch(e){pend=[];}
 if(view==='patrol')view='home';
 toast('已切換到：'+siteName(cfg));await render();window.scrollTo(0,0);syncAll();
}
async function saveCfg(){try{await Store.put('kv','sites',sites);}catch(e){toast('儲存失敗');}}

/* ---------- Google 試算表雲端 ---------- */
const live=new Map();let pend=[],syncing=false,syncErr='';
async function getRec(key){if(live.has(key))return live.get(key);const r=await recGet(key);if(r)live.set(key,r);return r;}
async function api(body){
 if(!cfg.gas)throw new Error('尚未設定雲端網址');
 const r=await fetch(cfg.gas,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:cfg.token||''},body))});
 const j=await r.json();if(!j.ok)throw new Error(j.err==='token'?'雲端密碼不正確':(j.err||'雲端錯誤'));return j;
}
async function markPend(key){if(!pend.includes(key)){pend.push(key);try{await Store.put('kv','pend|'+siteId,pend);}catch(e){}}}
function touch(i){const r=cur;if(!r.inited){r.inited=true;r.pts.forEach(p=>{p.dirty=true;p.v=(p.v||0)+1;});}const p=r.pts[i];p.dirty=true;p.v=(p.v||0)+1;}
async function saveCur(){await recPut(cur.key,cur);await markPend(cur.key);syncAll();}
function updateSync(){
 const el=$('#sync');if(!el)return;let t,c='';
 if(!cfg.gas)t='☁ 尚未連接 Google 試算表（紀錄只存在這支手機）';
 else if(syncing){t='☁ 上傳到雲端中…';c='wait';}
 else if(pend.length){t='☁ 有 '+pend.length+' 個班次尚未上傳'+(syncErr?'（'+syncErr+'）':'')+'，點此重試';c='wait';}
 else{t='☁ 已全部同步到 Google 試算表';c='ok';}
 el.textContent=t;el.className=c;
}
async function syncAll(){
 if(syncing||!cfg.gas||!pend.length){updateSync();return;}
 syncing=true;updateSync();
 try{
  for(const key of pend.slice()){
   const r=await getRec(key);
   if(r)for(let i=0;i<r.pts.length;i++){
    const p=r.pts[i];if(!p.dirty)continue;
    const v=p.v,sent=p.photos.slice();
    const j=await api({a:'point',site:cfg.site,code:cfg.code,date:r.date,dateText:fmtDate(r.date),slotId:r.slotId,time:r.time,routeName:r.routeName,seq:i+1,pid:p.pid,name:p.name,by:p.by||'',timeText:sent.length?fmtTime(sent[0].t,true):'',status:p.status,note:p.note,photos:sent.map(x=>x.id?{id:x.id,t:x.t}:{d:x.d,t:x.t})});
    sent.forEach((x,k)=>{if(j.photos&&j.photos[k])x.id=j.photos[k].id;});
    if(p.v===v)p.dirty=false;
    await recPut(key,r);
   }
   if(!r||!r.pts.some(p=>p.dirty)){pend=pend.filter(k=>k!==key);await Store.put('kv','pend|'+siteId,pend);}
  }
  syncErr='';
 }catch(e){syncErr=navigator.onLine===false?'目前沒有網路':(e.message||'連線失敗');}
 syncing=false;updateSync();
}
async function pullCfg(){
 const j=await api({a:'getcfg'}),list=(j.sites||(j.cfg?[j.cfg]:[])).filter(c=>c&&Array.isArray(c.points)).map(norm);
 if(!list.length)throw new Error('雲端還沒有設定，請管理者先上傳設定');
 const keep={gas:cfg.gas,token:cfg.token},lp=cfg.pin;let blank=!cfg.site&&!cfg.guards.length;
 for(const c of list){
  let t=sites.find(x=>x.cfg.code===c.code);
  if(!t&&blank){t=sites.find(x=>x.id===siteId);blank=false;}
  if(t){const lg=t.cfg.lastGuard;t.cfg=Object.assign(c,keep,{pin:c.pin||t.cfg.pin,lastGuard:c.guards.some(g=>g.name===lg)?lg:''});}
  else sites.push({id:uid(),cfg:Object.assign(c,keep,{pin:c.pin||lp,lastGuard:''})});
 }
 cfg=sites.find(x=>x.id===siteId).cfg;await saveCfg();return list.length;
}
const routeOf=s=>cfg.routes.find(r=>r.id===s.routeId)||cfg.routes[0];
const pointOf=id=>cfg.points.find(p=>p.id===id);

/* ---------- 日期時間 ---------- */
function dutyDate(){const d=new Date();if(d.getHours()<cfg.cutoff)d.setDate(d.getDate()-1);return ymd(d);}
function schedMs(date,time){const[h,m]=time.split(':').map(Number);const d=new Date(date+'T00:00:00');if(h<cfg.cutoff)d.setDate(d.getDate()+1);d.setHours(h,m,0,0);return d.getTime();}
function fmtDate(s){const[y,m,d]=s.split('-');return(cfg.roc?(y-1911):y)+'/'+m+'/'+d;}
function fmtTime(ms,sec){const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())+(sec?':'+pad(d.getSeconds()):'');}
function fmtDT(ms){return fmtDate(ymd(new Date(ms)))+' '+fmtTime(ms,true);}

/* ---------- 當日資料 ---------- */
async function dayData(date){
 const keys=(await recKeys()).filter(k=>k.startsWith(date+'_'));
 const recs=[];for(const k of keys){const r=await recGet(k);if(r)recs.push(r);}
 const rows=[],used=new Set();
 for(const s of cfg.slots){const r=recs.find(x=>x.slotId===s.id);if(r)used.add(r.key);rows.push(mkRow(date,r,s));}
 for(const r of recs)if(!used.has(r.key))rows.push(mkRow(date,r,null));
 rows.sort((a,b)=>a.sched-b.sched);
 return{rows,has:recs.length>0};
}
function mkRow(date,r,s){
 const time=r?r.time:s.time,sched=schedMs(date,time);
 if(!r){const rt=routeOf(s);return{sid:s.id,time,sched,routeName:rt?rt.name:'',guards:'',done:0,total:rt?rt.pids.filter(pointOf).length:0,first:0,judge:'未巡邏',jok:false,bad:0,rec:null};}
 const done=r.pts.filter(p=>p.photos.length).length;
 const ts=[];r.pts.forEach(p=>p.photos.forEach(x=>ts.push(x.t)));
 const first=ts.length?Math.min.apply(null,ts):0;
 const guards=[...new Set(r.pts.map(p=>p.by).filter(Boolean))].join('、')||r.guard||'';
 let judge='未打卡',jok=false;
 if(first){const df=first-sched,mn=Math.round(Math.abs(df)/60000);
  if(Math.abs(df)<=cfg.tol*60000){judge='準時';jok=true;}else judge=(df>0?'逾時':'提前')+mn+'分';}
 return{sid:r.slotId,time,sched,routeName:r.routeName,guards,done,total:r.pts.length,first,judge,jok,bad:r.pts.filter(p=>p.status==='異常').length,rec:r};
}

/* ---------- 畫面 ---------- */
let view='home',cur=null,repDate=null,unlocked=false,repPages=[],repCloud=null,repLoading=false,repErr='',repShow=14;
function setNav(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(view==='patrol'?'home':view)));}
async function render(){
 setNav();updateSync();
 const warn=Store.db?'':'<div class="warn">⚠️ 目前的開啟方式無法保存資料，關閉後紀錄會消失。請改用瀏覽器（Chrome／Safari）以網址開啟本系統。</div>';
 let h='';
 if(view==='home')h=await vHome();
 else if(view==='patrol')h=vPatrol();
 else if(view==='report')h=await vReport();
 else h=vSettings();
 $('#app').innerHTML=warn+h;
}

async function vHome(){
 if(!cfg.gas&&!cfg.site&&!cfg.guards.length&&sites.length===1)return '<div class="hero"><div class="site">巡邏打卡</div><div class="sub">第一次使用，請先連接雲端</div></div><div class="card"><div class="hint" style="margin-top:0">請貼上管理者提供的<b>雲端網址</b>與<b>雲端密碼</b>，再按下方按鈕。</div><input type="text" id="fgas" placeholder="雲端網址（https://script.google.com/…/exec）"><div style="height:8px"></div><input type="text" id="ftok" placeholder="雲端密碼"><button class="btn pri big" data-act="first">連線並下載設定</button></div><div class="hint">管理者第一次建立案場：請點下方「設定」自行填寫。</div>';
 const date=dutyDate(),{rows}=await dayData(date),now=Date.now();
 let h=sites.length>1?'<div class="chips" style="margin-bottom:12px">'+sites.map(x=>'<button class="chip'+(x.id===siteId?' on':'')+'" data-act="stSwitch" data-id="'+x.id+'">'+esc(siteName(x.cfg))+'</button>').join('')+'</div>':'';
 h+='<div class="hero"><div class="site">'+esc(cfg.site||'（請到「設定」填寫案場名稱）')+'</div><div class="sub">勤務日　<b>'+fmtDate(date)+'</b></div></div>';
 h+='<h3>巡邏人員</h3>';
 const bound=cfg.guards.some(g=>g.name===cfg.lastGuard);
 if(!cfg.guards.length)h+='<div class="hint">尚未建立巡邏人員，請到「設定」新增。</div>';
 else if(bound)h+='<div class="card" style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div style="font-size:20px;font-weight:800;color:var(--acc)">🔒 '+esc(cfg.lastGuard)+'</div><div class="hint" style="margin:2px 0 0">這支手機已綁定此人員，打卡都會記在他名下。</div></div><button class="btn sm" data-act="unbind">更換</button></div>';
 else h+='<div class="hint">這支手機尚未綁定巡邏人員。請點選<b>自己的名字</b>，綁定後就不用每次選，要更換需由管理者處理。</div><div class="chips">'+cfg.guards.map(g=>'<button class="chip" data-act="guard" data-n="'+esc(g.name)+'">'+esc(g.name)+'</button>').join('')+'</div>';
 h+='<h3>今日巡邏班次</h3>';
 if(!rows.length)h+='<div class="hint">尚未設定巡邏時間，請到「設定」新增。</div>';
 rows.forEach(r=>{
  let b,c='';
  if(r.rec&&(r.rec.end||(r.total&&r.done===r.total))){b='已完成 '+r.done+'/'+r.total;c='ok';}
  else if(r.done){b='進行中 '+r.done+'/'+r.total;c='go';}
  else if(now>r.sched+cfg.tol*60000){b='逾時未巡';c='bad';}
  else if(now<r.sched-cfg.tol*60000)b='未到時間';
  else{b='請開始巡邏';c='go';}

/* ---------- 拍照加浮水印 ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=src;});}
async function stampPhoto(file,place,when){
 const url=URL.createObjectURL(file);
 let img;try{img=await loadImg(url);}finally{setTimeout(()=>URL.revokeObjectURL(url),3000);}
 let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,1280/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
 const fs=Math.max(20,Math.round(Math.min(w,h)*0.05)),f2=Math.round(fs*0.62),ff='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
 const l3=[cfg.site,cfg.lastGuard].filter(Boolean).join('｜');
 x.font='bold '+fs+'px '+ff;let bw=Math.max(x.measureText(place).width,x.measureText(fmtDT(when)).width);
 x.font=f2+'px '+ff;bw=Math.max(bw,x.measureText(l3).width);
 const pd=Math.round(fs*0.5),bh=fs*2.5+(l3?f2*1.5:0)+pd*2,bx=w-bw-pd*3,by=h-bh-pd;
 x.fillStyle='rgba(0,0,0,.6)';x.fillRect(bx,by,bw+pd*2,bh);
 x.textAlign='right';x.textBaseline='top';const rx=w-pd*2;
 x.font='bold '+fs+'px '+ff;x.fillStyle='#ffd24a';x.fillText(place,rx,by+pd);
 x.fillStyle='#fff';x.fillText(fmtDT(when),rx,by+pd+fs*1.25);
 if(l3){x.font=f2+'px '+ff;x.fillStyle='#dfe6f5';x.fillText(l3,rx,by+pd+fs*2.55);}
 return c.toDataURL('image/jpeg',0.82);
}

 const MAXH=13000,pages=[];let pg=[],ph=0;
 for(const b of blocks){if(ph+b.h>MAXH&&pg.length){pages.push(pg);pg=[];ph=0;}pg.push(b);ph+=b.h;}
 if(pg.length)pages.push(pg);
 const out=[];
 for(let n=0;n<pages.length;n++){
  const hh=pages[n].reduce((a,b)=>a+b.h,0),c=document.createElement('canvas');c.width=W;c.height=hh;

  out.push({blob,name:nm,url:URL.createObjectURL(blob)});
 }
 return out;
